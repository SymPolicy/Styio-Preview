name: platform-adaptation

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - stable
      - nightly

jobs:
  build-and-test:
    name: platform-adaptation / linux-ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-18 \
            lld-18 \
            llvm-18-dev \
            libicu-dev \
            python3

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DSTYIO_ENABLE_FUZZ=ON

      - name: Build
        run: >
          cmake --build build --target
          styio styio_test styio_security_test styio_soak_test
          styio_fuzz_lexer styio_fuzz_parser

      - name: Docs audit
        run: ctest --test-dir build -L docs --output-on-failure

      - name: Security tests
        run: ctest --test-dir build -L security --output-on-failure

      - name: Five-layer pipeline tests
        run: ctest --test-dir build -L styio_pipeline --output-on-failure

      - name: Parser shadow gate (M1 full suite + artifacts)
        run: |
          mkdir -p build/parser-shadow-artifacts
          ./styio/benchmark/parser-shadow-suite-gate.sh ./build/bin/styio ./styio/tests/milestones/m1 ./build/parser-shadow-artifacts

      - name: Parser shadow gate (M2 full suite + artifacts)
        run: |
          mkdir -p build/parser-shadow-artifacts-m2
          ./styio/benchmark/parser-shadow-suite-gate.sh ./build/bin/styio ./styio/tests/milestones/m2 ./build/parser-shadow-artifacts-m2

      - name: Upload parser shadow artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: parser-shadow-artifacts
          path: |
            build/parser-shadow-artifacts
            build/parser-shadow-artifacts-m2
          if-no-files-found: ignore

      - name: Soak smoke tests
        run: ctest --test-dir build -L soak_smoke --output-on-failure

      - name: Milestone smoke
        run: ctest --test-dir build -R '^m1_t01_int_arith$|^m2_t01_simple_func$' --output-on-failure

      - name: Fuzz smoke
        run: ctest --test-dir build -L fuzz_smoke --output-on-failure

  test-smoke:
    name: test / smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 lld-18 llvm-18-dev libicu-dev python3

      - name: Configure smoke build
        run: >
          cmake -S . -B build/smoke -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DSTYIO_ENABLE_FUZZ=ON

      - name: Build smoke targets
        run: cmake --build build/smoke --target styio styio_test

      - name: Run smoke tests
        run: ctest --test-dir build/smoke -R '^m1_t01_int_arith$|^m2_t01_simple_func$' --output-on-failure

  test-golden-standard:
    name: test / golden-standard
    needs: [build-and-test, test-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install golden-standard dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-18 \
            lld-18 \
            llvm-18-dev \
            libicu-dev \
            python3

      - name: Configure golden-standard build
        run: >
          cmake -S . -B build/golden -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Build golden-standard targets
        run: >
          cmake --build build/golden --target
          styio styio_test styio_security_test styio_soak_test

      - name: Run milestone and pipeline goldens
        run: |
          ctest --test-dir build/golden -L milestone --output-on-failure
          ctest --test-dir build/golden -L styio_pipeline --output-on-failure

      - name: Run security and soak evidence
        run: |
          ctest --test-dir build/golden -L security --output-on-failure
          ctest --test-dir build/golden -L soak_smoke --output-on-failure
